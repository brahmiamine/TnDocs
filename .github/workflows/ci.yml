name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci_test_only
          MARIADB_DATABASE: tndocs_verify1
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Check types
        run: npm run typecheck
      - name: Migrate isolated database
        run: npm run db:migrate
        env:
          DATABASE_URL: mysql://root:ci_test_only@127.0.0.1:3306/tndocs_verify1
      - name: Database integration tests
        run: npm test && npm run test:integration
        env:
          DATABASE_URL: mysql://root:ci_test_only@127.0.0.1:3306/tndocs_verify1
          TEST_DATABASE_URL: mysql://root:ci_test_only@127.0.0.1:3306/tndocs_verify1
      - name: Build
        run: npm run build
